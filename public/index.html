<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Party Games Hub — Play Imposter & Avalon with friends online</title>
<meta name="description" content="Free online party games you play on your own phones — Guess the Imposter and The Resistance: Avalon. Create a room, share the code, play with 3–10 friends. English & Thai.">
<meta name="theme-color" content="#0f1020">
<meta name="keywords" content="party games, imposter, spyfall, avalon, resistance, online, multiplayer, social deduction, เกมปาร์ตี้, จับผู้แอบแฝง">
<link rel="canonical" href="https://guess-the-imposter-u50c.onrender.com/">
<!-- Social link preview (Open Graph + Twitter) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Party Games Hub">
<meta property="og:title" content="🎉 Party Games Hub — Imposter & Avalon">
<meta property="og:description" content="Free online party games on your own phones. Create a room, share the code, play with friends. English & Thai.">
<meta property="og:url" content="https://guess-the-imposter-u50c.onrender.com/">
<meta property="og:image" content="https://guess-the-imposter-u50c.onrender.com/og.png">
<meta property="og:image:width" content="1200">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="🎉 Party Games Hub — Imposter & Avalon">
<meta name="twitter:description" content="Free online party games on your own phones. Create a room, share the code, play with friends.">
<meta name="twitter:image" content="https://guess-the-imposter-u50c.onrender.com/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎉%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1020; --bg2:#1a1b3a; --card:#21234a; --card2:#2b2d5e;
    --accent:#ff5d8f; --accent2:#5d8bff; --good:#3ddc97; --bad:#ff5d5d; --gold:#ffd35d;
    --text:#f5f6ff; --muted:#a7a9c9; --line:#34376e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, var(--bg2), var(--bg));
    color:var(--text); min-height:100%; display:flex; flex-direction:column;
    align-items:center; padding:18px; overflow-x:hidden;
  }
  .app{width:100%; max-width:480px; flex:1; display:flex; flex-direction:column;}
  h1{font-size:1.6rem; text-align:center; margin:.2em 0 .1em;
     background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text; background-clip:text; color:transparent;}
  .tag{text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:18px; margin-bottom:14px; box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .screen{display:none;} .screen.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  label{display:block; font-size:.85rem; color:var(--muted); margin:12px 0 6px;}
  input,select{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-size:1rem; outline:none;}
  input:focus,select:focus{border-color:var(--accent2);}
  #codeInput{text-transform:uppercase; letter-spacing:4px; font-weight:700; text-align:center; font-size:1.4rem;}
  .row{display:flex; gap:10px;} .row>*{flex:1;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:14px;
    padding:14px 16px; font-size:1rem; font-weight:600; color:#fff;
    transition:transform .08s ease, filter .15s ease; width:100%;}
  button:active{transform:scale(.97);} button:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{background:linear-gradient(90deg,var(--accent),#ff7da6);}
  .btn-secondary{background:var(--card2); border:1px solid var(--line);}
  .btn-blue{background:linear-gradient(90deg,var(--accent2),#7da6ff);}
  .btn-good{background:linear-gradient(90deg,#2bbf85,var(--good)); color:#06281c;}
  .btn-bad{background:linear-gradient(90deg,#e23b3b,var(--bad));}
  .btn-gold{background:linear-gradient(90deg,#e6b800,var(--gold)); color:#3a2e00;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--muted);}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:48px; height:48px; font-size:1.4rem; padding:0; border-radius:12px;
    background:var(--card2); border:1px solid var(--line);}
  .stepper .val{flex:1; text-align:center; font-size:1.6rem; font-weight:700;}
  .pill{display:inline-block; padding:4px 10px; border-radius:999px; font-size:.75rem;
    background:var(--card2); color:var(--muted); margin:3px 4px 0 0;}
  .center{text-align:center;} .small{font-size:.8rem;} .muted{color:var(--muted);}
  .big{font-size:2rem; font-weight:800; margin:8px 0;}
  .code-show{font-size:2.6rem; font-weight:800; letter-spacing:8px;
    background:linear-gradient(90deg,var(--good),#9affd1);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .reveal-word{font-size:2rem; font-weight:800;
    background:linear-gradient(90deg,var(--good),#9affd1);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin:10px 0;}
  .imposter-word{font-size:2rem; font-weight:800;
    background:linear-gradient(90deg,var(--accent),#ff9bbb);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin:10px 0;}
  .timer{font-size:3rem; font-weight:800; text-align:center; font-variant-numeric:tabular-nums;}
  .timer.warn{color:var(--bad);}
  .plist{list-style:none; padding:0; margin:0;}
  .plist li{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg);
    border-radius:10px; margin-bottom:6px;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--good); flex:none;}
  .dot.off{background:var(--muted);}
  .badge{margin-left:auto; font-size:.7rem; padding:2px 8px; border-radius:999px;}
  .b-you{background:var(--accent2);} .b-host{background:var(--card2); color:var(--muted);}
  .b-leader{background:var(--gold); color:#3a2e00;} .b-team{background:var(--accent);}
  .order-list{counter-reset:o; padding:0; list-style:none; margin:8px 0 0;}
  .order-list li{counter-increment:o; padding:8px 12px; background:var(--bg); border-radius:10px;
    margin-bottom:6px; display:flex; align-items:center; gap:10px;}
  .order-list li::before{content:counter(o); width:26px; height:26px; flex:none;
    display:grid; place-items:center; border-radius:50%; background:var(--accent2); font-size:.8rem; font-weight:700;}
  .footer{margin-top:auto; padding-top:12px; text-align:center;}
  .stack>*+*{margin-top:10px;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--card2); border:1px solid var(--line); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:.9rem; opacity:0; transition:opacity .2s; pointer-events:none; z-index:99;}
  .toast.show{opacity:1;}
  .conn{position:fixed; top:8px; right:10px; font-size:.7rem; color:var(--muted);}
  .langbtn{position:fixed; top:6px; left:10px; z-index:50; width:auto; padding:6px 12px; font-size:.8rem;
    background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:999px;}
  .leavebtn{position:fixed; top:6px; left:78px; z-index:50; width:auto; padding:6px 12px; font-size:.8rem;
    background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:999px; display:none;}
  .game-card{display:flex; gap:12px; align-items:center; text-align:left; background:var(--bg);
    border:2px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px; cursor:pointer; color:var(--text);}
  .game-card.sel{border-color:var(--accent); background:var(--card2);}
  .game-card .emoji{font-size:1.8rem;}
  .game-card .gname{font-weight:700;}
  .game-card .gblurb{font-size:.75rem; color:var(--muted);}
  .selitem{display:flex; justify-content:space-between; align-items:center; padding:12px;
    background:var(--bg); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; text-align:left;}
  .selitem.on{border-color:var(--accent2); background:var(--card2);}
  .quest-track{display:flex; gap:6px; justify-content:center; margin:10px 0;}
  .qnode{flex:1; max-width:60px; aspect-ratio:1; border-radius:12px; display:grid; place-items:center;
    background:var(--bg); border:2px solid var(--line); font-weight:800; position:relative;}
  .qnode.cur{border-color:var(--gold); box-shadow:0 0 0 2px rgba(255,211,93,.3);}
  .qnode.pass{background:rgba(61,220,151,.2); border-color:var(--good); color:var(--good);}
  .qnode.fail{background:rgba(255,93,93,.2); border-color:var(--bad); color:var(--bad);}
  .qnode .sz{font-size:1.2rem;} .qnode .ff{position:absolute; bottom:2px; font-size:.6rem; color:var(--muted);}
  .track-dots{display:flex; gap:6px; justify-content:center; margin-top:6px;}
  .track-dots i{width:12px; height:12px; border-radius:50%; background:var(--line);}
  .track-dots i.used{background:var(--bad);}
  .chip-list{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px;}
  .log{font-size:.78rem; color:var(--muted); max-height:130px; overflow-y:auto;}
  .log div{padding:3px 0; border-bottom:1px solid rgba(255,255,255,.05);}
  .vote-grid{display:flex; flex-wrap:wrap; gap:6px; justify-content:center;}
  .vote-grid .vp{padding:6px 10px; border-radius:10px; font-size:.8rem; background:var(--bg); border:1px solid var(--line);}
  .vote-grid .vp.app{border-color:var(--good); color:var(--good);}
  .vote-grid .vp.rej{border-color:var(--bad); color:var(--bad);}
  .selectable{cursor:pointer;}
</style>
</head>
<body>
<button class="langbtn" id="langBtn">ไทย</button>
<button class="leavebtn" id="leaveBtn" data-i18n="leaveRoom">🚪 Leave</button>
<div class="conn" id="conn">connecting…</div>
<div class="app">
  <h1 id="title" data-i18n="title">🎉 Party Games Hub</h1>
  <div class="tag" id="subtag" data-i18n="subtag">Play together on your own phones</div>

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="card">
      <div class="small muted center" id="gamesCount" style="margin-bottom:10px">🎮</div>
      <div id="homeGames"></div>
    </div>
    <div class="card">
      <label data-i18n="yourName">Your name</label>
      <input id="nameInput" type="text" data-i18n-ph="namePh" maxlength="16" autocomplete="off">
    </div>
    <div class="stack">
      <button class="btn-primary" id="createBtn" data-i18n="createRoom">➕ Create a Room</button>
      <div class="center muted small" data-i18n="orJoin">— or join one —</div>
      <input id="codeInput" type="text" data-i18n-ph="codePh" maxlength="4" autocomplete="off">
      <button class="btn-blue" id="joinBtn" data-i18n="joinRoom">Join Room →</button>
    </div>
    <div class="footer muted small" data-i18n="homeFoot">One person creates a room and shares the code. Everyone else joins from their own phone.</div>
  </section>

  <!-- LOBBY -->
  <section id="lobby" class="screen">
    <div class="card center">
      <div class="muted small" data-i18n="shareCode">Room code — share this</div>
      <div class="code-show" id="roomCode">----</div>
      <button class="btn-ghost" id="copyLink" data-i18n="copyLink" style="margin-top:8px">📋 Copy invite link</button>
    </div>
    <div class="card">
      <div class="small muted" style="margin-bottom:6px"><span data-i18n="players">Players</span> (<span id="playerCount">0</span>)</div>
      <ul class="plist" id="lobbyPlayers"></ul>
    </div>
    <div class="card">
      <div class="small muted center" style="margin-bottom:8px" data-i18n="chooseGame">Choose a game</div>
      <div id="gamePicker"></div>
    </div>
    <div class="card" id="settingsCard" style="display:none">
      <div class="small muted center" style="margin-bottom:6px" data-i18n="settingsHost">Game settings (host)</div>
      <div id="settingsBox"></div>
    </div>
    <button class="btn-primary" id="startBtn" style="display:none">Start Game</button>
    <div class="center muted small" id="waitHost" style="display:none" data-i18n="waitHost">Waiting for the host…</div>
  </section>

  <!-- GAME (rendered by modules) -->
  <section id="game" class="screen"><div id="gameRoot"></div></section>
</div>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/i18n.js"></script>
<script src="/games/imposter.js"></script>
<script src="/games/avalon.js"></script>
<script>
const $ = id => document.getElementById(id);
const socket = io();
const t = (k, v) => window.I18N.t(k, v);
window.GAMES = window.GAMES || {};
let YOU = null, ROOM = null, LAST_STATE = null, HUB_GAMES = [];

const show = id => {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  $('leaveBtn').style.display = id==='home' ? 'none' : 'block';   // nav: leave only shows inside a room
};
function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }
const isHost = () => ROOM && ROOM.hostId === YOU;
const emitAction = (type, payload={}) => socket.emit('gameAction', { type, ...payload });
window.HUB = { t, toast, emitAction, get you(){return YOU;}, get isHost(){return isHost();}, socket };

/* ---- static i18n ---- */
function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el=> el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=> el.placeholder = t(el.dataset.i18nPh));
  $('langBtn').textContent = window.I18N.getLang()==='en' ? 'ไทย' : 'EN';
  document.documentElement.lang = window.I18N.getLang();
}
$('langBtn').onclick = ()=> window.I18N.setLang(window.I18N.getLang()==='en'?'th':'en');
document.addEventListener('langchange', ()=>{
  applyStatic();
  renderHomeGames();
  if(ROOM && ROOM.state==='lobby') renderLobby();
  if($('game').classList.contains('active') && LAST_STATE && window.GAMES[LAST_STATE.game])
    window.GAMES[LAST_STATE.game].render($('gameRoot'), LAST_STATE, window.HUB);
});
applyStatic();

/* ---- landing games showcase ---- */
socket.on('games', list=>{ HUB_GAMES = list; renderHomeGames(); });
function gName(g){ const k='game.'+g.id+'.name'; const v=t(k); return v===k? g.name : v; }
function gBlurb(g){ const k='game.'+g.id+'.blurb'; const v=t(k); return v===k? g.blurb : v; }
function renderHomeGames(){
  if(!HUB_GAMES.length) return;
  $('gamesCount').textContent = '🎮 ' + t(HUB_GAMES.length===1?'gamesAvailable1':'gamesAvailable',{n:HUB_GAMES.length});
  $('homeGames').innerHTML = HUB_GAMES.map(g=>`
    <div class="game-card" style="cursor:default">
      <div class="emoji">${g.emoji}</div>
      <div style="flex:1">
        <div class="gname">${gName(g)}</div>
        <div class="gblurb">${gBlurb(g)}</div>
        <div class="gblurb" style="margin-top:3px">${t('playerRange',{min:g.min,max:g.max})}</div>
      </div>
    </div>`).join('');
}

socket.on('connect', ()=>$('conn').textContent='online');
socket.on('disconnect', ()=>$('conn').textContent='reconnecting…');
socket.on('errorMsg', m=>toast(m));

/* ---- HOME ---- */
const params = new URLSearchParams(location.search);
if(params.get('room')) $('codeInput').value = params.get('room').toUpperCase().slice(0,4);
try{ const n=localStorage.getItem('hub_name'); if(n) $('nameInput').value=n; }catch(e){}
function myName(){ const n=$('nameInput').value.trim(); try{localStorage.setItem('hub_name',n);}catch(e){} return n; }

$('createBtn').onclick=()=>{
  if(!myName()) return toast(t('enterName'));
  socket.emit('createRoom',{name:myName()}, r=>{ if(r&&r.ok) YOU=r.youId; });
};
$('joinBtn').onclick=()=>{
  if(!myName()) return toast(t('enterName'));
  const code=$('codeInput').value.trim().toUpperCase();
  if(code.length<4) return toast(t('enterCode'));
  socket.emit('joinRoom',{code,name:myName()}, r=>{ if(r&&r.ok) YOU=r.youId; else toast(r&&r.error||t('couldNotJoin')); });
};
$('copyLink').onclick=()=>{
  const url=location.origin+'/?room='+ROOM.code;
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast(t('inviteCopied'))).catch(()=>prompt('Copy:',url));
  else prompt('Copy this link:',url);
};
$('startBtn').onclick=()=>socket.emit('startGame');

/* ---- NAV: leave room → home (no page refresh) ---- */
function goHome(){
  YOU=null; ROOM=null; LAST_STATE=null;
  $('gameRoot').innerHTML='';
  $('codeInput').value='';
  show('home');
}
$('leaveBtn').onclick=()=>{
  if(ROOM && ROOM.state==='ingame' && !confirm(t('confirmLeave'))) return;
  socket.emit('leaveRoom');
  goHome();
};

/* ---- ROOM / LOBBY ---- */
socket.on('room', room=>{
  ROOM = room;
  if(!YOU) return;
  if(room.state==='lobby') renderLobby();
});

function gameName(id){ const k='game.'+id+'.name'; const v=t(k); return v===k ? (ROOM.games.find(g=>g.id===id)||{}).name : v; }
function gameBlurb(id){ const k='game.'+id+'.blurb'; const v=t(k); return v===k ? (ROOM.games.find(g=>g.id===id)||{}).blurb : v; }

function renderLobby(){
  show('lobby');
  $('roomCode').textContent = ROOM.code;
  $('playerCount').textContent = ROOM.players.length;
  const ul=$('lobbyPlayers'); ul.innerHTML='';
  ROOM.players.forEach(p=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="dot ${p.connected?'':'off'}"></span><span>${p.name}</span>`;
    if(p.id===ROOM.hostId) li.insertAdjacentHTML('beforeend',`<span class="badge b-host">${t('bHost')}</span>`);
    if(p.id===YOU) li.insertAdjacentHTML('beforeend',`<span class="badge b-you">${t('bYou')}</span>`);
    ul.appendChild(li);
  });

  const host=isHost();
  const picker=$('gamePicker'); picker.innerHTML='';
  ROOM.games.forEach(g=>{
    const sel = ROOM.gameType===g.id;
    const fits = ROOM.players.length>=g.min && ROOM.players.length<=g.max;
    const div=document.createElement('div');
    div.className='game-card'+(sel?' sel':'');
    div.innerHTML=`<div class="emoji">${g.emoji}</div>
      <div style="flex:1"><div class="gname">${gameName(g.id)}</div>
      <div class="gblurb">${gameBlurb(g.id)}</div>
      <div class="gblurb" style="margin-top:3px;color:${fits?'var(--good)':'var(--bad)'}">${t('playerRange',{min:g.min,max:g.max})}</div></div>
      ${sel?'<div>✓</div>':''}`;
    if(host) div.onclick=()=>socket.emit('selectGame',g.id);
    else div.style.cursor='default';
    picker.appendChild(div);
  });

  const settingsCard=$('settingsCard'), box=$('settingsBox');
  if(ROOM.gameType && window.GAMES[ROOM.gameType] && window.GAMES[ROOM.gameType].renderSettings && host){
    settingsCard.style.display='block'; box.innerHTML='';
    window.GAMES[ROOM.gameType].renderSettings(box, ROOM, patch=>socket.emit('updateSettings',patch), window.HUB);
  } else settingsCard.style.display='none';

  const g = ROOM.games.find(x=>x.id===ROOM.gameType);
  const n = ROOM.players.length;
  const canStart = g && n>=g.min && n<=g.max;
  $('startBtn').style.display = host?'block':'none';
  $('waitHost').style.display = host?'none':'block';
  if(host){
    $('startBtn').disabled = !canStart;
    $('startBtn').textContent = !ROOM.gameType ? t('pickFirst')
      : !canStart ? t('needPlayers',{min:g.min,max:g.max}) : t('startX',{game:gameName(ROOM.gameType)});
  } else {
    $('waitHost').textContent = ROOM.gameType ? t('hostSettingUp',{game:gameName(ROOM.gameType)}) : t('waitingPick');
  }
}

/* ---- IN-GAME ---- */
socket.on('gameState', state=>{
  LAST_STATE = state;
  show('game');
  const mod = window.GAMES[state.game];
  if(!mod){ $('gameRoot').innerHTML='<div class="card">'+t('unknownGame')+'</div>'; return; }
  mod.render($('gameRoot'), state, window.HUB);
});
</script>
</body>
</html>
